{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobTrack{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'applications/styles.css' %}">
</head>
<body>
  <header class="topbar"><a class="brand" href="{% url 'dashboard' %}">JobTrack</a>
    <nav>{% if user.is_authenticated %}<span class="welcome">Hi, {{ user.username }}</span><form class="inline" action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="link-button" type="submit">Log out</button></form>{% else %}<a href="{% url 'login' %}">Log in</a>{% endif %}</nav>
  </header>
  <main class="container">
    {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>JobTrack · Keep your job search organized</footer>
</body></html>
